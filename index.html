<script>
  let selectedFiles = []; // Array of { name, type, blob }
  let processedFilesCache = [];
  let currentScale = 0.50;
  let currentFormat = 'image/jpeg';
  let thumbObjectUrls = [];
  let isProcessed = false;

  const fileInput = document.getElementById('fileInput');
  const previewTitle = document.getElementById('previewTitle');
  const thumbGrid = document.getElementById('thumbGrid');
  const emptyState = document.getElementById('emptyState');
  const actionButton = document.getElementById('actionButton');
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loaderText');

  function setScale(scale, el) {
    currentScale = scale;
    document.querySelectorAll('#sizeGroup .btn-option').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    invalidateProcessedCache();
  }

  function setFormat(format, el) {
    currentFormat = format;
    document.querySelectorAll('#formatGroup .btn-option').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    invalidateProcessedCache();
  }

  function invalidateProcessedCache() {
    if (selectedFiles.length > 0) {
      isProcessed = false;
      processedFilesCache = [];
      actionButton.classList.remove('ready-state');
      actionButton.innerText = `⚙ Process Images (${selectedFiles.length})`;
    }
  }

  function resetApp() {
    clearOldThumbUrls();
    selectedFiles = [];
    processedFilesCache = [];
    isProcessed = false;
    fileInput.value = '';
    emptyState.style.display = 'block';
    thumbGrid.style.display = 'none';
    thumbGrid.innerHTML = '';
    previewTitle.innerText = 'Selected Previews (0)';
    actionButton.disabled = true;
    actionButton.classList.remove('ready-state');
    actionButton.innerText = 'Select Images First';
    
    const defaultScaleBtn = document.querySelectorAll('#sizeGroup .btn-option')[2];
    if (defaultScaleBtn) setScale(0.50, defaultScaleBtn);
    setFormat('image/jpeg', document.querySelectorAll('#formatGroup .btn-option')[0]);
  }

  function clearOldThumbUrls() {
    thumbObjectUrls.forEach(url => URL.revokeObjectURL(url));
    thumbObjectUrls = [];
  }

  // Safe HEIC decoding with typed Uint8Array and WASM initialization
  async function decodeHeicToCanvas(blob) {
    const arrayBuffer = await blob.arrayBuffer();
    const uint8Array = new Uint8Array(arrayBuffer);
    
    // Initialize libheif instance
    const heif = window.libheif();
    const decoder = new heif.HeifDecoder();
    const images = decoder.decode(uint8Array);
    
    if (!images || !images.length) throw new Error("Could not decode HEIC image.");

    const image = images[0];
    const width = image.get_width();
    const height = image.get_height();

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.createImageData(width, height);

    await new Promise((resolve, reject) => {
      image.display(imageData, (displayData) => {
        if (!displayData) return reject(new Error('HEIF display error'));
        resolve();
      });
    });

    ctx.putImageData(imageData, 0, 0);
    return { canvas, width, height };
  }

  fileInput.addEventListener('change', async (e) => {
    clearOldThumbUrls();
    const rawFiles = Array.from(e.target.files);
    
    // Immediately slice raw files into independent Blobs to freeze file handles
    selectedFiles = rawFiles.map(f => ({
      name: f.name,
      type: f.type,
      blob: f.slice(0, f.size, f.type)
    }));

    if (selectedFiles.length > 0) {
      emptyState.style.display = 'none';
      thumbGrid.style.display = 'grid';
      thumbGrid.innerHTML = '';
      previewTitle.innerText = `Selected Previews (${selectedFiles.length})`;
      actionButton.disabled = false;
      invalidateProcessedCache();

      selectedFiles.forEach((fileObj) => {
        const ext = fileObj.name.split('.').pop().substring(0, 4);
        const isHeic = fileObj.name.toLowerCase().endsWith('.heic') || fileObj.name.toLowerCase().endsWith('.heif');

        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrapper';
        
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" fill="%232c2c2e"><rect width="120" height="120"/></svg>';
        
        const badge = document.createElement('div');
        badge.className = 'thumb-ext';
        badge.innerText = ext;

        wrap.appendChild(img);
        wrap.appendChild(badge);
        thumbGrid.appendChild(wrap);

        if (isHeic) {
          decodeHeicToCanvas(fileObj.blob).then(({ canvas, width, height }) => {
            const thumbCanvas = document.createElement('canvas');
            thumbCanvas.width = 160;
            thumbCanvas.height = Math.round((height / width) * 160);
            const tCtx = thumbCanvas.getContext('2d');
            tCtx.drawImage(canvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
            
            thumbCanvas.toBlob(blob => {
              if (blob) {
                const url = URL.createObjectURL(blob);
                thumbObjectUrls.push(url);
                img.src = url;
              }
              canvas.width = 0; canvas.height = 0;
              thumbCanvas.width = 0; thumbCanvas.height = 0;
            }, 'image/jpeg', 0.6);
          }).catch((err) => { 
            console.error("HEIC Thumbnail Error for", fileObj.name, ":", err);
            badge.innerText = "ERR"; 
          });
        } else {
          const url = URL.createObjectURL(fileObj.blob);
          thumbObjectUrls.push(url);
          img.src = url;
        }
      });
    } else {
      resetApp();
    }
  });

  async function handleActionClick() {
    if (!isProcessed) {
      await processAllImages();
    } else {
      await shareNow();
    }
  }

  async function processAllImages() {
    if (selectedFiles.length === 0) return;
    loader.style.display = 'flex';
    processedFilesCache = [];

    try {
      for (let i = 0; i < selectedFiles.length; i++) {
        const fileObj = selectedFiles[i];
        loaderText.innerText = `Processing ${i + 1} of ${selectedFiles.length}...`;

        // Give browser micro-tasks time to update UI and execute garbage collection
        await new Promise(r => setTimeout(r, 20));

        const isHeic = fileObj.name.toLowerCase().endsWith('.heic') || fileObj.name.toLowerCase().endsWith('.heif');
        let targetMime = currentFormat === 'original' ? fileObj.type : 'image/jpeg';
        if (!targetMime || isHeic || targetMime.includes('heic') || targetMime.includes('heif')) {
          targetMime = 'image/jpeg';
        }

        let finalBlob = null;

        if (currentScale === 1.0 && !isHeic && (currentFormat === 'original' || fileObj.type === targetMime)) {
          finalBlob = fileObj.blob;
        } else if (isHeic) {
          const { canvas, width, height } = await decodeHeicToCanvas(fileObj.blob);
          const scaledCanvas = document.createElement('canvas');
          scaledCanvas.width = Math.max(1, Math.round(width * currentScale));
          scaledCanvas.height = Math.max(1, Math.round(height * currentScale));

          const sCtx = scaledCanvas.getContext('2d');
          sCtx.imageSmoothingEnabled = true;
          sCtx.imageSmoothingQuality = 'high';
          sCtx.drawImage(canvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

          finalBlob = await new Promise(res => scaledCanvas.toBlob(res, targetMime, 0.88));

          canvas.width = 0; canvas.height = 0;
          scaledCanvas.width = 0; scaledCanvas.height = 0;
        } else {
          const headerBmp = await createImageBitmap(fileObj.blob);
          const targetW = Math.max(1, Math.round(headerBmp.width * currentScale));
          const targetH = Math.max(1, Math.round(headerBmp.height * currentScale));
          headerBmp.close();

          const resizedBmp = await createImageBitmap(fileObj.blob, {
            resizeWidth: targetW,
            resizeHeight: targetH,
            resizeQuality: 'high'
          });

          const canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(resizedBmp, 0, 0);
          resizedBmp.close();

          finalBlob = await new Promise(res => canvas.toBlob(res, targetMime, 0.88));
          canvas.width = 0; canvas.height = 0;
        }

        let ext = targetMime.split('/')[1] || 'jpg';
        if (ext === 'jpeg') ext = 'jpg';
        const baseName = fileObj.name.substring(0, fileObj.name.lastIndexOf('.')) || fileObj.name;
        const newFileName = `${baseName}_${Math.round(currentScale * 100)}pct.${ext}`;

        processedFilesCache.push(new File([finalBlob], newFileName, { type: targetMime }));
      }

      loader.style.display = 'none';
      isProcessed = true;

      actionButton.classList.add('ready-state');
      actionButton.innerText = `📤 Open Share Sheet (${processedFilesCache.length} Ready)`;

    } catch (error) {
      loader.style.display = 'none';
      alert("Error during image processing: " + error.message);
    }
  }

  async function shareNow() {
    if (processedFilesCache.length === 0) return;

    // Calculate total size in megabytes
    const totalBytes = processedFilesCache.reduce((acc, f) => acc + f.size, 0);
    const totalMB = totalBytes / (1024 * 1024);

    // Android Web Share intent failure safety check (max ~80MB recommended)
    if (totalMB > 80) {
      const confirmDownload = confirm(
        `Total image payload is ${totalMB.toFixed(1)}MB. Android share sheets often fail on payloads over 80MB.\n\nClick OK to download all images directly instead.`
      );
      if (confirmDownload) {
        triggerDirectDownloads();
        return;
      }
    }

    if (navigator.canShare && navigator.canShare({ files: processedFilesCache })) {
      try {
        await navigator.share({
          files: processedFilesCache,
          title: 'Resized Images',
          text: 'Here are your resized images.'
        });
      } catch (err) {
        if (err.name !== 'AbortError') {
          alert("Share sheet error: " + err.message + "\n\nFallback: Initiating direct downloads.");
          triggerDirectDownloads();
        }
      }
    } else {
      alert("Direct sharing not permitted for this selection. Downloading images...");
      triggerDirectDownloads();
    }
  }

  function triggerDirectDownloads() {
    processedFilesCache.forEach((file, index) => {
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(file);
        a.download = file.name;
        a.click();
      }, index * 200); // Stagger downloads so Android doesn't block popup requests
    });
  }
</script>
